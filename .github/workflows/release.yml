name: Signed Mac release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag matching package.json, e.g. v0.2.0"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: macos-26-intel
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare notarization key
        shell: bash
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo 'Configure APPLE_API_KEY_BASE64 in the release environment.'
            exit 1
          fi
          key_path="$RUNNER_TEMP/pine-desk-notarization.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - run: node scripts/release-preflight.cjs --publishing
      - run: npm ci
      - run: npm run test:desktop
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: signed-desktop-failure
          path: test-results/desktop/
      - name: Create or reuse draft release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [ "$draft" != 'true' ]; then
              echo 'This release is already published. Use a new version and tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Pine Desk $RELEASE_TAG" --generate-notes
          fi
      - run: npm run build
      - name: Sign, notarize and upload both architectures to draft
        run: npx electron-builder --config electron-builder.release.cjs --mac --publish always
      - name: Verify installed app signatures and notarization tickets
        shell: bash
        run: |
          for app_path in 'release/mac/Pine Desk.app' 'release/mac-arm64/Pine Desk.app'; do
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          done
          node scripts/verify-update-assets.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: pine-desk-mac-signed-${{ env.RELEASE_TAG }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
      - name: Publish verified stable release
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Remove notarization key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pine-desk-notarization.p8"
