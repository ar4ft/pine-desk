name: Verify, package and publish previews
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
  mac:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            arch: x64
          - runner: macos-26
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PINE_DESK_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:desktop
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-failure-${{ matrix.arch }}
          path: test-results/desktop/
      - run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Verify disk image, archive, architecture and installed app
        run: node scripts/verify-mac-package.cjs ${{ matrix.arch }}
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: package-failure-${{ matrix.arch }}
          path: test-results/desktop/
      - uses: actions/upload-artifact@v4
        with:
          name: pine-desk-mac-verification-${{ matrix.arch }}
          if-no-files-found: error
          path: test-results/desktop/package-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: pine-desk-mac-unsigned-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
  prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: unsigned-prerelease-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: pine-desk-mac-unsigned-*
          merge-multiple: false
          path: unsigned-artifacts
      - name: Publish verified unsigned prerelease
        run: node scripts/publish-unsigned.cjs --artifacts unsigned-artifacts
